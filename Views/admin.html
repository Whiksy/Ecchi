<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý File Nhận</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f4f4f9; padding: 20px; }
        h1 { text-align: center; color: #333; font-weight: 700; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img, .card video {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .media-placeholder {
            width: 100%;
            height: 200px;
            background-color: #eee;
            border-radius: 8px;
        }
        .info { margin: 10px 0; font-size: 14px; color: #555; }
        .delete-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .delete-btn:hover { background-color: #ff4c4c; }
        .header-actions {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-action {
            background-color: #97cdff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-action:hover { background-color: #74b9ff; }
    </style>
</head>
<body>
    <h1>👑 Khu Vực Admin 👑</h1>
    <div class="header-actions">
        <a href="/index.html" class="btn-action">🏠 Về trang chủ</a>
        <button class="btn-action" onclick="fetchMedia()" style="margin-left: 10px;">🔄 Làm mới</button>
        <button onclick="logout()" class="btn-action" style="margin-left: 10px; background-color: #ff6b6b;">🔐 Đăng xuất</button>
    </div>
    <div class="grid" id="mediaContainer"></div>

    <script>
        const authToken = sessionStorage.getItem('authToken');

        // Bảo vệ trang: Nếu không có token, quay về trang đăng nhập
        if (!authToken) {
            window.location.href = '/admin_login.html';
        }

        async function fetchMedia() {
            try {
                const res = await fetch('/api/media', {
                    headers: { 'Authorization': authToken }
                });

                // Kiểm tra xem request có thành công không (status 200-299)
                if (!res.ok) {
                    // Nếu lỗi là 401 (Unauthorized), nghĩa là token sai hoặc hết hạn -> đăng xuất
                    if (res.status === 401) {
                        console.error("Xác thực thất bại! Token không hợp lệ. Đang đăng xuất...");
                        return logout();
                    }
                    // Với các lỗi khác, báo lỗi chung
                    throw new Error(`Không thể tải dữ liệu. Status: ${res.status}`);
                }

                // Chỉ khi request thành công (res.ok = true) thì mới xử lý dữ liệu
                const data = await res.json();
                const container = document.getElementById('mediaContainer');
                container.innerHTML = '';

                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    
                    const mediaPlaceholder = document.createElement('div');
                    mediaPlaceholder.className = 'media-placeholder';

                    const mediaElement = item.file_type.startsWith('video')
                        ? document.createElement('video')
                        : document.createElement('img');
                    
                    mediaElement.controls = item.file_type.startsWith('video');

                    // Lấy file với token và tạo URL object
                    fetch(`/api/media/file/${item.id}`, { headers: { 'Authorization': authToken } })
                        .then(response => {
                            if (!response.ok) {
                                // Nếu không tải được file media (ví dụ token hết hạn giữa chừng)
                                console.error(`Không tải được file media ID: ${item.id}`);
                                // Có thể hiển thị một ảnh báo lỗi tại đây
                                return;
                            }
                            return response.blob();
                        })
                        .then(blob => {
                            if (blob) {
                                const objectURL = URL.createObjectURL(blob);
                                mediaElement.src = objectURL;
                                mediaPlaceholder.replaceWith(mediaElement); // Thay thế placeholder bằng media thật
                            }
                        }).catch(err => console.error('Lỗi tải file media:', err));

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'info';
                    infoDiv.innerHTML = `<strong>Từ: ${item.sender_name}</strong><br>Ngày: ${new Date(item.created_at).toLocaleString()}`;

                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'delete-btn';
                    deleteButton.textContent = 'Xóa';
                    deleteButton.onclick = () => deleteMedia(item.id);

                    div.appendChild(mediaPlaceholder);
                    div.appendChild(infoDiv);
                    div.appendChild(deleteButton);
                    container.appendChild(div);
                });
            } catch (error) {
                console.error("Lỗi khi tải media:", error);
                alert("Có lỗi xảy ra, vui lòng đăng nhập lại.");
                logout();
            }
        }

        async function deleteMedia(id) {
            if (!confirm("Sốp có chắc muốn xóa không?")) return;
            await fetch(`/api/media/${id}`, { 
                method: 'DELETE',
                headers: { 'Authorization': authToken }
            });
            fetchMedia(); // Refresh list
        }

        function logout() {
            sessionStorage.removeItem('authToken');
            window.location.href = '/login.html';
        }

        // Tải dữ liệu khi trang được mở
        if (authToken) fetchMedia();
    </script>
</body>
</html>
